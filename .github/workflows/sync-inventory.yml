name: Daily inventory update

# The whole chain, once a day:
#
#   Shiftly  ->  data/inventory.json  ->  357 HTML pages  ->  danthemancan.live
#
# Because the snapshot is a full replacement, a vehicle added upstream appears
# on the next run and a vehicle withdrawn upstream disappears — no manual
# listing management at either end.
#
# Need it sooner than tomorrow? Actions tab -> Daily inventory update ->
# Run workflow.
#
# Required repository secrets:
#   SHIFTLY_API_KEY   the inventory credential
#   FTP_SERVER        the cPanel host
#   FTP_USERNAME      the cPanel FTP user
#   FTP_PASSWORD      that user's password
#
# Required repository variables:
#   SHIFTLY_API_URL   the get-csv-file endpoint, with its fixed parameters
#
# Pushing the commit is what triggers a redeploy on Vercel, Netlify, Cloudflare
# Pages or any host wired to this branch.

on:
  schedule:
    # Once a day, 13:00 UTC — 9am Eastern in summer, 8am in winter.
    #
    # Shiftly regenerates the export in the early morning Eastern (the copy
    # observed while wiring this up carried Last-Modified 11:42 UTC), so this
    # lands after the new file is ready and before the day's first customers
    # are browsing.
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      adapter:
        description: 'Source adapter to use'
        required: false
        default: ''
        type: choice
        options: ['', 'shiftly', 'feed', 'sitemap-jsonld', 'demo']
      force:
        description: 'Bypass the shrink guard (use when a large drop is genuine)'
        required: false
        default: false
        type: boolean

concurrency:
  group: sync-inventory
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    working-directory: bassett-court

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bassett-court/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync inventory from Shiftly
        env:
          INVENTORY_SOURCE_URL: ${{ vars.INVENTORY_SOURCE_URL }}
          INVENTORY_SOURCE_ADAPTER: ${{ vars.INVENTORY_SOURCE_ADAPTER }}
          INVENTORY_FEED_URL: ${{ secrets.INVENTORY_FEED_URL }}
          # Shiftly Auto. The key is a secret; the rest are plain variables.
          SHIFTLY_API_URL: ${{ vars.SHIFTLY_API_URL }}
          SHIFTLY_API_KEY: ${{ secrets.SHIFTLY_API_KEY }}
          SHIFTLY_AUTH_STYLE: ${{ vars.SHIFTLY_AUTH_STYLE }}
          SHIFTLY_AUTH_HEADER: ${{ vars.SHIFTLY_AUTH_HEADER }}
          SHIFTLY_AUTH_PARAM: ${{ vars.SHIFTLY_AUTH_PARAM }}
          SHIFTLY_DEALER_ID: ${{ vars.SHIFTLY_DEALER_ID }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.adapter }}" ]; then ARGS="$ARGS --source=${{ inputs.adapter }}"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          npm run sync -- $ARGS

      - name: Commit the snapshot
        id: commit
        run: |
          if git diff --quiet -- data/; then
            echo "No inventory change."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COUNT=$(node -p "require('./data/inventory.json').vehicleCount")
          git config user.name  "inventory-sync[bot]"
          git config user.email "inventory-sync@users.noreply.github.com"
          git add data/
          git commit -m "chore(inventory): sync — ${COUNT} vehicles"

          # The schedule can collide with a human push; rebase rather than fail.
          for attempt in 1 2 3; do
            if git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep $((attempt * 5))
          done

          echo "Could not push the snapshot after 3 attempts." >&2
          exit 1

      - name: Build the static site
        env:
          NEXT_PUBLIC_SITE_URL: https://danthemancan.live
          NEXT_PUBLIC_FORM_ENDPOINT: ${{ vars.NEXT_PUBLIC_FORM_ENDPOINT }}
          NEXT_PUBLIC_FORM_ACCESS_KEY: ${{ secrets.NEXT_PUBLIC_FORM_ACCESS_KEY }}
        run: npm run build:static

      - name: Upload to the web server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # FTPS where the host supports it; set to "ftp" only if it does not,
          # since plain FTP sends the password in the clear.
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./bassett-court/out/
          server-dir: ${{ vars.FTP_REMOTE_DIR || 'public_html/' }}
          # The action keeps a manifest on the server and uploads only what
          # changed, so a normal day moves a handful of files rather than 757.
          state-name: .deploy-state.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      # A failed run is otherwise silent: the sync has already committed fresh
      # inventory, the upload is skipped, and the site serves yesterday's
      # vehicles with nothing but a red tick on a page nobody is watching.
      # This routes it to whatever channel reaches Dan for a new lead.
      #
      # Needs the ALERT_TOKEN secret, matching alert_token in config.php. With
      # no token set the step does nothing, so the workflow is unchanged until
      # it is configured. It never fails the run — the run has already failed,
      # and a broken alert must not bury the real error.
      - name: Say that the run failed
        if: failure() && env.ALERT_TOKEN != ''
        continue-on-error: true
        env:
          ALERT_TOKEN: ${{ secrets.ALERT_TOKEN }}
          SITE: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://danthemancan.live' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS --max-time 20 -X POST "$SITE/api/alert.php" \
            -H 'Content-Type: application/json' \
            -H "X-Alert-Token: $ALERT_TOKEN" \
            -d "$(jq -nc \
                  --arg t 'Inventory sync failed' \
                  --arg d 'The site was not updated. It is still serving the previous build.' \
                  --arg u "$RUN_URL" \
                  '{title:$t, detail:$d, url:$u}')" \
            || echo 'Could not reach the alert endpoint.'

      - name: Summary
        if: always()
        run: |
          {
            echo "### Daily inventory update"
            echo ''
            if [ -f data/inventory.json ]; then
              node -e "
                const s = require('./data/inventory.json');
                console.log('- Vehicles published: **' + s.vehicleCount + '**');
                console.log('- Adapter: \`' + s.adapter + '\`');
                console.log('- Generated: ' + s.generatedAt);
              "
            fi
            if [ -f data/sync-log.json ]; then
              node -e "
                const log = require('./data/sync-log.json')[0];
                if (log) {
                  console.log('- Added: ' + log.added.length + ' · Removed: ' + log.removed.length + ' · Repriced: ' + log.repriced.length);
                  if (!log.ok) console.log('');
                  if (!log.ok) console.log('> Run did not publish: ' + (log.note || 'see job log'));
                }
              "
            fi
          } >> "$GITHUB_STEP_SUMMARY"
